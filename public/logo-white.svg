<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="purpleGradientWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B6BAF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#BFA4CB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0D3E8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Flower Petals -->
  <g transform="translate(100, 80)">
    <!-- Center circle -->
    <circle cx="0" cy="0" r="12" fill="#D8C8E0"/>
    
    <!-- Top petal -->
    <ellipse cx="0" cy="-35" rx="18" ry="28" fill="url(#purpleGradientWhite)" transform="rotate(0)"/>
    
    <!-- Top-right petal -->
    <ellipse cx="0" cy="-35" rx="18" ry="28" fill="url(#purpleGradientWhite)" transform="rotate(60)"/>
    
    <!-- Bottom-right petal -->
    <ellipse cx="0" cy="-35" rx="18" ry="28" fill="url(#purpleGradientWhite)" transform="rotate(120)"/>
    
    <!-- Bottom petal -->
    <ellipse cx="0" cy="-35" rx="18" ry="28" fill="url(#purpleGradientWhite)" transform="rotate(180)"/>
    
    <!-- Bottom-left petal -->
    <ellipse cx="0" cy="-35" rx="18" ry="28" fill="url(#purpleGradientWhite)" transform="rotate(240)"/>
    
    <!-- Top-left petal -->
    <ellipse cx="0" cy="-35" rx="18" ry="28" fill="url(#purpleGradientWhite)" transform="rotate(300)"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="190" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FRAGVIEW</text>
</svg>
